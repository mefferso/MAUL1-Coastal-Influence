name: Research forcing observation archive

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/forcing-archive.yml'
      - 'scripts/collect_nwcl1_forcing.py'
      - 'scripts/validate_forcing_archive.py'
      - 'scripts/collect_mrms_basin_qpe.py'
      - 'tests/test_collect_nwcl1_forcing.py'
      - 'tests/test_collect_mrms_basin_qpe.py'
      - 'tests/test_forcing_archive.py'
      - 'docs/prospective-forcing-archive.md'
      - 'docs/rainfall-tributary-observation-acquisition.md'
      - 'research/local-forcing-feasibility/source_inventory.json'
      - 'research/local-forcing-feasibility/mrms-requirements.txt'

permissions:
  contents: read

concurrency:
  group: forcing-archive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  fixtures-and-live-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional MRMS geospatial decoder
        run: python -m pip install -r research/local-forcing-feasibility/mrms-requirements.txt
      - run: python -m unittest tests.test_collect_nwcl1_forcing tests.test_collect_mrms_basin_qpe tests.test_forcing_archive -v
      - name: Verify live NOAA and USGS current endpoints
        run: python scripts/collect_nwcl1_forcing.py --live-smoke
      - name: Verify live MRMS product and NLDI basin endpoints
        run: python scripts/collect_mrms_basin_qpe.py --live-smoke

  collect-and-persist:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect observations and source health
        id: collect
        continue-on-error: true
        run: python scripts/collect_nwcl1_forcing.py --out-dir research/prospective-forcing-archive
      - name: Install optional MRMS geospatial decoder
        continue-on-error: true
        run: python -m pip install -r research/local-forcing-feasibility/mrms-requirements.txt
      - name: Collect optional MRMS basin aggregates
        if: always()
        continue-on-error: true
        run: python scripts/collect_mrms_basin_qpe.py --out-dir research/prospective-forcing-archive
      - name: Summarize source health
        if: always()
        run: |
          latest=$(ls -1t research/prospective-forcing-archive/health/*.json 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No run-health report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist immutable payloads, receipts, and run health
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/prospective-forcing-archive
          if ! git diff --cached --quiet; then
            git commit -m 'Archive prospective coastal forcing observations'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - name: Fail visibly on any critical feed failure or empty response
        if: always()
        run: test '${{ steps.collect.outcome }}' = success
