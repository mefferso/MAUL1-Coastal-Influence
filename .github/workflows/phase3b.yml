name: Phase 3B historical validation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archived history integrity
        run: python scripts/history_validate.py --root site/data/history
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate Phase 3B validation from archived observations
        run: python scripts/validate_phase3b.py --root site/data/history --output site/data/history/phase3b
      - name: Validate generated reports
        run: |
          for report in validation.json summary.json cases.json coverage.json event-diagnostics.json; do
            python -m json.tool "site/data/history/phase3b/$report" > /dev/null
          done
          test -s site/data/history/phase3b/report.md
          test -s site/data/history/phase3b/events.csv
          test -s site/data/history/phase3b/matches.csv
          test -s site/data/history/phase3b/exclusions.csv
          test -s site/data/history/phase3b/revised-report.md
          test -s site/data/history/phase3b/response-events.csv
          test -s site/data/history/phase3b/response-matches.csv
          test -s site/data/history/phase3b/control-windows.csv
      - name: Commit Phase 3B reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/data/history/phase3b
          .github/scripts/publish-with-rebase-retry.sh "${GITHUB_REF_NAME}" "data: publish Phase 3B historical validation"
