name: Historical archive backfill
on:
  workflow_dispatch:
    inputs:
      start_month:
        description: First UTC month, inclusive (YYYY-MM)
        required: true
        default: '2016-01'
      end_month:
        description: Last UTC month, inclusive (YYYY-MM)
        required: true
        default: '2026-10'
      refresh:
        description: Re-fetch existing successful partitions
        required: true
        type: boolean
        default: false
      run_discovery:
        description: Rebuild hourly reports and event discovery after acquisition
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/history.yml'
      - 'scripts/history.py'
      - 'scripts/history_sources.py'
      - 'scripts/history_validate.py'
      - 'scripts/discover.py'
      - 'scripts/analyze.py'
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      START_MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.start_month || '2016-01' }}
      END_MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.end_month || '2026-10' }}
      REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh || false }}
      RUN_DISCOVERY: ${{ github.event_name != 'workflow_dispatch' || inputs.run_discovery }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire annual batches
        run: |
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'scripts')
          from history import month_range
          months = month_range(os.environ['START_MONTH'], os.environ['END_MONTH'])
          for offset in range(0, len(months), 12):
              batch = months[offset:offset + 12]
              command = [sys.executable, 'scripts/history.py',
                         '--start-month', batch[0], '--end-month', batch[-1]]
              if os.environ.get('REFRESH', '').lower() == 'true':
                  command.append('--refresh')
              print(f"Acquiring {batch[0]} through {batch[-1]}", flush=True)
              subprocess.run(command, check=True)
          PY
      - name: Validate acquired history
        run: python scripts/history_validate.py --root site/data/history
      - name: Commit acquired partitions
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/data/history/raw site/data/history/manifest.json
          git diff --cached --quiet || (git commit -m "data: persist acquired historical partitions" && git push)
      - name: Rebuild hourly reports
        run: |
          set +e
          PYTHONPATH=scripts python - <<'PY' > history-rebuild.log 2>&1
          import json, history
          result=history.rebuild_hourly_reports('site/data/history')
          print(json.dumps({'months':result['months'],'hourly_records':result['hourly_records'],
            'quality_status':result['quality']['status'],'quality_findings':result['quality']['finding_count'],
            'wind_status':result['wind_comparison']['status'],'wind_overlap':result['wind_comparison']['overlap_records']},sort_keys=True))
          PY
          status=$?
          if [ "$status" -ne 0 ]; then tail -n 200 history-rebuild.log; fi
          exit "$status"
      - name: Upload rebuild diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historical-rebuild-diagnostics-${{ github.run_id }}
          path: history-rebuild.log
          if-no-files-found: ignore
      - name: Build event discovery
        if: ${{ env.RUN_DISCOVERY == 'true' }}
        run: python scripts/discover.py --root site/data/history
      - name: Commit changed history artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/data/history
          git diff --cached --quiet || (git commit -m "data: backfill historical archive" && git push)
