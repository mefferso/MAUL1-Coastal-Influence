name: MCHL1 one-time source probe
on:
  pull_request:
    paths:
      - scripts/probe_mchl1.py
      - tests/test_probe_mchl1.py
      - .github/workflows/mchl1-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation
        run: python -m unittest discover -s tests -p test_probe_mchl1.py -v
      - name: Probe candidate HADS source (read-only; non-fatal)
        run: |
          python scripts/probe_mchl1.py --hours 96 > mchl1-probe-result.json || true
          cat mchl1-probe-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: mchl1-source-probe
          path: mchl1-probe-result.json
          retention-days: 14
