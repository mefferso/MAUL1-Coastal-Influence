name: Phase 6 prospective verification
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      issuance_mode:
        description: Simulation is isolated; authentic performs a current-time issue
        type: choice
        options: [simulation, authentic]
        default: simulation
  pull_request:
    paths: ['.github/workflows/phase6.yml', 'scripts/phase6*.py', 'tests/test_phase6*.py', 'tests/phase6-site-smoke.cjs', 'site/phase6.js', 'site/data/prospective/**', 'docs/phase6-*.md', 'site/index.html']
  push:
    branches: [main]
    paths: ['.github/workflows/phase6.yml', 'scripts/phase6*.py', 'tests/test_phase6*.py', 'tests/phase6-site-smoke.cjs', 'site/phase6.js', 'site/data/prospective/model-artifacts.json', 'docs/phase6-*.md', 'site/index.html']
permissions:
  contents: write
concurrency:
  group: phase6-single-writer-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-phase5a.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify frozen model reproduction
        run: python scripts/phase6_models.py --root . --output /tmp/model-artifacts.json
      - name: Live source check on hosted runner
        run: python -c "import sys; sys.path.insert(0,'scripts'); import phase6_sources; assert phase6_sources.live_smoke(), 'no live source responded'"
      - run: node --check site/phase6.js && node tests/site-smoke.cjs && node tests/phase6-site-smoke.cjs
  run-cycle:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-phase5a.txt
      - name: Issue and verify current observations
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.issuance_mode || 'authentic' }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$MODE" = simulation ]; then
            python scripts/phase6.py --simulate --run-id "$RUN_ID"
          else
            python scripts/phase6.py --run-id "$RUN_ID"
          fi
      - name: Validate dashboard data
        run: |
          python -m json.tool site/data/prospective/latest.json >/dev/null
          python -m json.tool site/data/prospective/performance.json >/dev/null
          node --check site/phase6.js
          node tests/phase6-site-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-cycle-${{ github.run_id }}
          path: site/data/prospective
          retention-days: 90
      - name: Commit append-only archive with retry-safe rebase
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/data/prospective
          git diff --cached --quiet && exit 0
          git commit -m 'data: archive Phase 6 prospective cycle'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish phase 6 archive after retries' >&2
          exit 1
