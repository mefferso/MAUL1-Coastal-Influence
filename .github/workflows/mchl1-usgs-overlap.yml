name: MCHL1 USGS historical overlap probe
on:
  pull_request:
    paths:
      - scripts/probe_mchl1_usgs_overlap.py
      - tests/test_mchl1_usgs_overlap.py
      - .github/workflows/mchl1-usgs-overlap.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline parsing and causal differences
        run: python -m unittest discover -s tests -p test_mchl1_usgs_overlap.py -v
      - name: Query independent historical observations (diagnostic-only)
        run: |
          set -o pipefail
          python scripts/probe_mchl1_usgs_overlap.py \
            --window 2022-12-20 2022-12-25 \
            --window 2024-11-14 2024-11-19 \
            --raw-dir mchl1-usgs-raw | tee mchl1-usgs-overlap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mchl1-usgs-overlap-multiple-periods
          path: |
            mchl1-usgs-overlap.json
            mchl1-usgs-raw/
          retention-days: 21
