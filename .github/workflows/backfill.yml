name: Manual historical event refresh
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/analyze.py > /dev/null
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool site/data/analysis.json > /dev/null
      - name: Commit updated event archive
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/data
          git diff --cached --quiet || (git commit -m 'data: refresh historical events' && git push)
