name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Historical archive backfill", "Phase 3B historical validation", "Phase 4 evidence evaluation", "Phase 5A hindcast evaluation", "Phase 5B tidal-aware robustness evaluation"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-phase5a.txt
      - run: python scripts/analyze.py > /dev/null
      - run: python scripts/analyze.py > /dev/null
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool site/data/manifest.json > /dev/null
      - run: python -m json.tool site/data/analysis.json > /dev/null
      - run: python -m json.tool site/data/verification.json > /dev/null
      - name: Validate historical reports when present
        run: |
          if [ -f site/data/history/manifest.json ]; then
            python scripts/history_validate.py --root site/data/history > /dev/null
            for report in coverage.json quality.json wind-comparison.json discovery.json; do
              if [ -f "site/data/history/$report" ]; then python -m json.tool "site/data/history/$report" > /dev/null; fi
            done
          fi
      - run: node --check site/app.js
      - run: node tests/site-smoke.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
