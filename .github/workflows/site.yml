name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Historical archive backfill", "Phase 3B historical validation", "Phase 4 evidence evaluation", "Phase 5A hindcast evaluation", "Phase 5B tidal-aware robustness evaluation", "Phase 6 prospective verification"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-phase5a.txt
      - name: Reproduce historical Phase 5A and Phase 5B baselines into temporary outputs
        run: |
          temp_dir="$(mktemp -d)"
          mkdir -p "$temp_dir/phase5a" "$temp_dir/phase5b"
          echo "MODEL_LAB_REPRO_DIR=$temp_dir" >> "$GITHUB_ENV"
          python scripts/phase5a.py --root . --outdir "$temp_dir/phase5a" > /dev/null
          python scripts/phase5b.py --root . --out "$temp_dir/phase5b" > /dev/null
      - name: Rebuild and compare deterministic Model Lab report
        run: |
          python scripts/model_lab.py --root . --reproduction-dir "$MODEL_LAB_REPRO_DIR" --output "$MODEL_LAB_REPRO_DIR/report-one.json" --markdown "$MODEL_LAB_REPRO_DIR/findings.md" > /dev/null
          cmp "$MODEL_LAB_REPRO_DIR/report-one.json" site/data/research/model-lab.json
          cmp "$MODEL_LAB_REPRO_DIR/findings.md" docs/model-lab-findings.md
          cmp "$MODEL_LAB_REPRO_DIR/findings.md" site/data/research/model-lab-findings.md
          python scripts/model_lab.py --root . --reproduction-dir "$MODEL_LAB_REPRO_DIR" --output "$MODEL_LAB_REPRO_DIR/report-two.json" --markdown "$MODEL_LAB_REPRO_DIR/findings-two.md" > /dev/null
          cmp "$MODEL_LAB_REPRO_DIR/report-one.json" "$MODEL_LAB_REPRO_DIR/report-two.json"
          cmp "$MODEL_LAB_REPRO_DIR/findings.md" "$MODEL_LAB_REPRO_DIR/findings-two.md"
          git diff --exit-code -- site/data/history site/data/prospective
      - name: Rebuild the significant-rise audit and compact Model Lab payload
        run: |
          audit_dir="$(mktemp -d)"
          python research/rise-failure-audit/audit.py --root . --output-dir "$audit_dir" > /dev/null
          for report in analysis.json event-diagnostics.csv false-alert-clusters.csv representative-timelines.json report.md; do
            cmp "$audit_dir/$report" "research/rise-failure-audit/$report"
          done
          python scripts/build_significant_rise_site_data.py --check
          git diff --exit-code -- site/data/history site/data/prospective
      - run: python scripts/analyze.py > /dev/null
      - run: python scripts/analyze.py > /dev/null
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool site/data/manifest.json > /dev/null
      - run: python -m json.tool site/data/analysis.json > /dev/null
      - run: python -m json.tool site/data/verification.json > /dev/null
      - name: Validate MAUL1 observation context when published
        run: |
          if [ -f site/data/maul1-observation-context.json ]; then
            python -c "import json,sys; sys.path.insert(0,'scripts'); import maul1_observation_context as c; c.validate_dataset(json.load(open('site/data/maul1-observation-context.json')))"
          fi
      - name: Validate historical reports when present
        run: |
          if [ -f site/data/history/manifest.json ]; then
            python scripts/history_validate.py --root site/data/history > /dev/null
            for report in coverage.json quality.json wind-comparison.json discovery.json; do
              if [ -f "site/data/history/$report" ]; then python -m json.tool "site/data/history/$report" > /dev/null; fi
            done
          fi
      - run: node --check site/app.js
      - run: node --check site/phase6.js
      - run: node --check site/research-dashboard.js
      - run: node --check site/navigation.js
      - run: node --check site/forecast-view.js
      - run: node --check site/performance-data.js
      - run: node --check site/performance-explorer.js
      - run: node --check site/model-lab.js
      - run: node --check site/significant-rise.js
      - run: python -m py_compile scripts/maul1_observation_context.py
      - run: python -m py_compile scripts/model_lab.py
      - run: node tests/navigation-forecast-smoke.cjs
      - run: node tests/site-smoke.cjs
      - run: node tests/phase6-site-smoke.cjs
      - run: node tests/research-dashboard-smoke.cjs
      - run: node tests/test_performance_explorer.js
      - run: node tests/performance-explorer-smoke.cjs
      - run: node tests/test_model_lab_ui.js
      - run: node tests/model-lab-smoke.cjs
      - run: node tests/significant-rise-smoke.cjs
      - run: python -m unittest discover -s research/rise-failure-audit -v
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    # Multiple push/workflow_run triggers may finish together. GitHub Pages
    # accepts only one active deployment; queue rather than race them.
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
